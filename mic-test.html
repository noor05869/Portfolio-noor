<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Quality & Playback Tester</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
    
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-white">Mic Audio Playback Check</h1>
      <p class="text-xs text-slate-400 mt-1">Click record, speak for a few seconds, then click stop & play</p>
    </div>

    <!-- Live Level Meter -->
    <div class="mb-5 bg-slate-900 p-4 rounded-xl border border-slate-700">
      <div class="flex justify-between text-xs text-slate-400 mb-1.5 font-medium">
        <span>Mic Activity</span>
        <span id="statusText" class="text-indigo-400">Press Record</span>
      </div>
      <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
        <div id="meter" class="bg-emerald-400 h-full w-0 transition-all duration-75"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="space-y-3 mb-6">
      <button id="btnAction" onclick="handleBtn()" class="w-full py-3.5 px-4 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-500 text-white transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
        🔴 Start Recording
      </button>

      <!-- Player -->
      <div id="playerBox" class="hidden mt-4 p-4 rounded-xl bg-slate-900 border border-slate-700 text-center">
        <div class="text-xs font-semibold text-emerald-400 mb-2">Recording Ready: Click Play Below ⬇️</div>
        <audio id="audio" controls class="w-full mb-3"></audio>
        <button onclick="playAudioDirectly()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-bold text-white shadow">
          ▶️ Click to Force Play Recording
        </button>
      </div>
    </div>

    <!-- Quick External Fallback -->
    <div class="pt-4 border-t border-slate-700/60 text-center">
      <p class="text-xs text-slate-400 mb-2">If your browser blocks local audio playback:</p>
      <a href="https://online-voice-recorder.com/" target="_blank" class="inline-block px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-semibold text-indigo-300 border border-slate-600">
        Open Online Voice Recorder (External Site) ↗
      </a>
    </div>

  </div>

  <script>
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let streamRef = null;
    let audioContext = null;
    let audioBlobUrl = null;

    async function handleBtn() {
      if (!isRecording) {
        startRec();
      } else {
        stopRec();
      }
    }

    async function startRec() {
      recordedChunks = [];
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        streamRef = stream;

        // Visual Meter
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(stream);
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          source.connect(analyser);
          const dataArray = new Uint8Array(analyser.frequencyBinCount);

          function updateMeter() {
            if (!isRecording) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let pct = Math.min(100, Math.round((avg / 50) * 100));
            document.getElementById('meter').style.width = pct + '%';
            requestAnimationFrame(updateMeter);
          }
          updateMeter();
        } catch(e) {}

        const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);
          audioBlobUrl = URL.createObjectURL(blob);

          const audio = document.getElementById('audio');
          audio.src = audioBlobUrl;
          document.getElementById('playerBox').classList.remove('hidden');
          document.getElementById('statusText').innerText = "Stopped - Ready to Play";

          // Try auto-play
          audio.play().catch(err => {
            console.log("Browser requires explicit click to play audio");
          });
        };

        mediaRecorder.start(200); // 200ms timeslices
        isRecording = true;

        document.getElementById('btnAction').innerText = "⏹️ Stop Recording (Speak Now)";
        document.getElementById('btnAction').className = "w-full py-3.5 px-4 rounded-xl font-bold text-sm bg-rose-600 hover:bg-rose-500 text-white transition-all shadow-lg shadow-rose-600/30 flex items-center justify-center gap-2";
        document.getElementById('statusText').innerText = "🔴 Recording Live...";
        document.getElementById('playerBox').classList.add('hidden');

      } catch (err) {
        alert("Microphone Error: " + err.message);
      }
    }

    function stopRec() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (streamRef) {
        streamRef.getTracks().forEach(t => t.stop());
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
      }
      isRecording = false;

      document.getElementById('btnAction').innerText = "🔴 Record Again";
      document.getElementById('btnAction').className = "w-full py-3.5 px-4 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-500 text-white transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2";
      document.getElementById('meter').style.width = '0%';
    }

    function playAudioDirectly() {
      const audio = document.getElementById('audio');
      if (audio.src) {
        audio.currentTime = 0;
        audio.play();
      }
    }
  </script>
</body>
</html>
